<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Job Requirements</title>
    <style>
        :root {
            --thumb-size: 200px;
            --bg-color: #121214;
            --card-bg: #202024;
            --text-color: #e1e1e6;
            --accent: #8257e5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            padding: 24px;
        }
        header {
            margin-bottom: 24px;
            border-bottom: 1px solid #323238;
            padding-bottom: 12px;
        }
        h1 { font-size: 1.25rem; font-weight: 600; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--thumb-size), 1fr));
            gap: 16px;
        }
        .thumb-card a {
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            border: 1px solid #323238;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }
        .thumb-card a:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
        }
        .img-wrapper {
            width: 100%;
            height: var(--thumb-size);
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .label {
            padding: 8px 10px;
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }
    </style>
</head>
